[project]
name = "yara-gate"
version = "0.2.0"
description = "Quarantine untrusted files until a YARA scan finishes."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Christopher Grady" }]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "olefile>=0.46",
    "oletools>=0.60.2",
    "platformdirs>=4.12.4",
    "pydantic>=2.7",
    "typer>=0.12",
    "watchdog>=4.0",
    "yara-x>=1.20",
]

[project.scripts]
yara-gate = "yara_gate.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"rules/local" = "yara_gate/bundled_rules/local"
"rules/rules.lock" = "yara_gate/bundled_rules/rules.lock"
"rules/vendor-overrides.json" = "yara_gate/bundled_rules/vendor-overrides.json"
"tests/fixtures/benign" = "yara_gate/bundled_rules/benign"

[dependency-groups]
dev = ["mypy>=1.11", "pytest>=8.2", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# Typer requires Option() calls in argument defaults.
"src/yara_gate/cli.py" = ["B008"]
# Tests assert, bind a rejected address, redact a /tmp example, and launch the local CLI.
"tests/**" = ["S101", "S104", "S108", "S310", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["yara_gate"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["yara_x", "olefile", "oletools", "oletools.*", "watchdog", "watchdog.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: builds and installs a wheel"]
