name: ci

on:
  # Branch pushes run through their pull request; pushing to every branch ran each PR twice.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Actionlint
        if: runner.os == 'Linux'
        env:
          GOFLAGS: -modcacherw
        # v1.7.12, selected by commit. go install also checks sum.golang.org.
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca
          "$(go env GOPATH)/bin/actionlint"

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync from the lock file
        run: uv sync --frozen --group dev

      # Actionlint checks syntax, types, and shell. Zizmor checks what a valid workflow can
      # still get wrong: an action not pinned to a commit, checkout credentials left on disk,
      # an event field expanded into a script, a permission wider than the job needs.
      - name: Zizmor
        if: runner.os == 'Linux'
        run: uv run zizmor --offline --pedantic .github

      - name: Lock file matches pyproject
        run: uv lock --check

      - name: Ruff
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      # scripts/ holds the gate that decides whether a commit is published.
      - name: Mypy
        run: uv run mypy --strict src scripts

      - name: Compile and lint local rules
        run: uv run python docs/verification/lint_rules.py

      - name: Rule generator drift, reach, and refusals
        run: uv run python docs/verification/check_rule_generator.py

      - name: Check rules.lock hashes
        run: uv run python docs/verification/check_rules_lock.py

      - name: Rule fire and near-miss pairs
        run: uv run python docs/verification/check_rule_pairs.py

      - name: Added-rule checks
        run: uv run python docs/verification/check_added_rules.py

      - name: Local rule false positives
        run: uv run python docs/verification/measure_precision.py --fail-over

      - name: No bidi or invisible controls in tracked text
        run: uv run python docs/verification/check_text_controls.py

      - name: Relative Markdown links and heading anchors resolve
        run: uv run python docs/verification/check_doc_links.py

      - name: In-place scans
        run: uv run python docs/verification/check_scan_only.py

      - name: Exercise intake and rule coverage
        run: uv run python docs/research/probe_rule_coverage.py --verify

      - name: Detection gaps and their benign boundaries
        run: uv run python docs/research/probe_detection_gaps.py --verify

      - name: Worst-case timing tripwire (4 MiB inputs)
        timeout-minutes: 5
        run: uv run python docs/verification/check_worst_case_timing.py

      - name: Selftest
        run: uv run yara-gate selftest

      - name: Pytest
        run: uv run pytest

  # Windows has no O_NOFOLLOW, so inbox intake there checks the entry with lstat before the
  # open and by identity after it; check_intake.py exercises that path. watch and selftest
  # are not run here.
  windows:
    name: scan-only (windows-2025)
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync from the lock file
        run: uv sync --frozen --group dev

      - name: Compile and lint local rules
        run: uv run python docs/verification/lint_rules.py

      # Fails if the checkout rewrote line endings (see .gitattributes).
      - name: Check rules.lock hashes
        run: uv run python docs/verification/check_rules_lock.py

      - name: Rule fire and near-miss pairs
        run: uv run python docs/verification/check_rule_pairs.py

      - name: No bidi or invisible controls in tracked text
        run: uv run python docs/verification/check_text_controls.py

      - name: Added-rule checks
        run: uv run python docs/verification/check_added_rules.py

      - name: In-place scans
        run: uv run python docs/verification/check_scan_only.py

      - name: Inbox intake without O_NOFOLLOW
        run: uv run python docs/verification/check_intake.py

      - name: Reviewed release and Windows audit identity
        run: uv run pytest -q tests/test_release.py::test_release_cli_binds_review_and_resubmission
