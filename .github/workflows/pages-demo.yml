name: pages-demo

on:
  pull_request:
    paths:
      - web-demo/**
      - scripts/build_pages.py
      - .github/workflows/pages-demo.yml
  push:
    branches: [main]
    paths:
      - web-demo/**
      - scripts/build_pages.py
      - .github/workflows/pages-demo.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-demo-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate and build only the public demo
        run: |
          python3 scripts/build_pages.py --output build/pages
          node --check build/pages/app.mjs
          node --check build/pages/recordings.mjs
      - name: Upload Pages artifact for an explicit main deployment
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/pages
          retention-days: 1

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy reviewed static artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
